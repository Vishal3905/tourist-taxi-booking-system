{% extends "base.html" %}

{% block content %}

<div class="admin-container">

    <h1>👨‍💼 Admin Login</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
